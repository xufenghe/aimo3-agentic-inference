name: Feature request
description: Propose a focused improvement or experiment
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or research question does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful interface and expected behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evaluation plan
      description: How could this be tested without private data or expensive hardware?
    validations:
      required: true
