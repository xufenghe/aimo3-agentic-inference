[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimo3-agentic-inference"
version = "0.2.0"
description = "Reusable orchestration primitives for tool-augmented mathematical reasoning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Xufeng He"}]
keywords = ["aimo", "mathematical-reasoning", "self-consistency", "llm", "inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.12"]

[project.scripts]
aimo3 = "aimo3_inference.cli:main"

[project.urls]
Homepage = "https://github.com/xufenghe/aimo3-agentic-inference"
Documentation = "https://github.com/xufenghe/aimo3-agentic-inference/tree/main/docs"
Issues = "https://github.com/xufenghe/aimo3-agentic-inference/issues"
Repository = "https://github.com/xufenghe/aimo3-agentic-inference"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
